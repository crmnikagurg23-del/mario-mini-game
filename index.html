<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Super Mario Road - Desktop Pro</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Outfit:wght@600;700;800;900&display=swap');

        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }
        body {
            background: radial-gradient(circle at center, #1e1b4b 0%, #090d16 60%, #030712 100%);
            font-family: 'Outfit', -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #f8fafc;
            padding: 20px;
        }
        .desktop-wrapper {
            display: flex;
            gap: 16px;
            width: 100%;
            max-width: 1120px;
            height: 640px;
        }

        /* Left Side Panel (History & Stats) */
        .side-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            width: 280px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .side-title { font-size: 14px; font-weight: 800; color: #94a3b8; text-transform: uppercase; }
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
            flex: 1;
        }
        .history-item {
            background: #090d16;
            border: 1px solid #1e293b;
            padding: 8px 12px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            font-weight: 800;
            font-size: 13px;
        }
        .item-win { color: #4ade80; }
        .item-loss { color: #f87171; }

        /* Main Game Cabinet */
        .main-cabinet {
            flex: 1;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 25px 60px rgba(0,0,0,0.8);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .brand-title {
            font-size: 20px;
            font-weight: 900;
            font-family: 'Fredoka', cursive;
            color: #ef4444;
        }
        .brand-title span { color: #fbbf24; }
        .top-actions { display: flex; gap: 8px; align-items: center; }
        .world-badge {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: #fff;
            padding: 5px 12px;
            border-radius: 8px;
            font-weight: 900;
            font-size: 12px;
        }
        .btn-toggle, .lang-select {
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-toggle.active { background: #2563eb; color: #fff; }
        .lang-select { color: #fbbf24; font-weight: 800; }

        .screen-container {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid #334155;
            width: 100%;
            height: 340px;
            background: #000;
        }
        canvas { display: block; width: 100%; height: 100%; }

        .status-banner {
            background: #090d16;
            padding: 10px;
            border-radius: 12px;
            text-align: center;
            font-weight: 800;
            font-size: 15px;
            border: 1px solid #1e293b;
        }

        .controls-grid {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .bet-box {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
        }
        .bet-box label { font-size: 10px; color: #64748b; font-weight: 800; text-transform: uppercase; }
        .bet-input-row { display: flex; gap: 4px; }
        input, select {
            background: #090d16;
            border: 1px solid #334155;
            color: #fff;
            padding: 10px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 800;
            text-align: center;
            outline: none;
            width: 100%;
        }
        .btn-quick {
            background: #1e293b;
            border: 1px solid #334155;
            color: #94a3b8;
            padding: 0 10px;
            border-radius: 8px;
            font-weight: 800;
            cursor: pointer;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
            flex: 1.5;
        }
        .btn-action {
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 900;
            border: none;
            cursor: pointer;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-bet { background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: #fff; }
        .btn-next { background: linear-gradient(135deg, #22c55e, #15803d); color: #fff; }
        .btn-cashout { background: linear-gradient(135deg, #fbbf24, #d97706); color: #000; }
        .btn-warp { background: linear-gradient(135deg, #c084fc, #7e22ce); color: #fff; }
        .btn-action:disabled { background: #1e293b !important; color: #475569 !important; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="desktop-wrapper">
    <!-- Left Panel -->
    <div class="side-panel">
        <div class="side-title">Live History</div>
        <div class="history-list" id="history-list">
            <div style="font-size: 12px; color: #475569;">No rounds yet</div>
        </div>
        <div style="border-top: 1px solid #1e293b; padding-top: 10px;">
            <div style="font-size: 10px; color: #64748b; font-weight: 800;">TOTAL BALANCE</div>
            <div style="font-size: 24px; font-weight: 900; color: #fbbf24;" id="balance-display">$1000.00</div>
        </div>
    </div>

    <!-- Main Cabinet -->
    <div class="main-cabinet">
        <div class="top-bar">
            <div class="brand-title">🍄 SUPER MARIO <span>ROAD PRO</span></div>
            <div class="top-actions">
                <div class="world-badge" id="world-badge">WORLD 1-1</div>
                <select class="lang-select" id="lang-select">
                    <option value="en">🇬🇧 EN</option>
                    <option value="ka">🇬🇪 KA</option>
                </select>
                <button class="btn-toggle" id="turbo-btn">⚡ Turbo: OFF</button>
                <button class="btn-toggle" id="sound-btn">🔊 Sound: ON</button>
            </div>
        </div>

        <div class="screen-container">
            <canvas id="gameCanvas" width="800" height="340"></canvas>
        </div>

        <div class="status-banner" id="status-msg">Place your bet and start the game</div>

        <div class="controls-grid">
            <div class="bet-box">
                <label>Bet Amount ($)</label>
                <div class="bet-input-row">
                    <input type="number" id="bet-input" value="10" min="1" max="1000">
                    <button class="btn-quick" id="btn-half">½</button>
                    <button class="btn-quick" id="btn-double">2×</button>
                    <button class="btn-quick" id="btn-max">MAX</button>
                </div>
            </div>
            <div class="bet-box" style="flex: 0.8;">
                <label>Risk Mode</label>
                <select id="mines-select">
                    <option value="1">Easy (High Win)</option>
                    <option value="2" selected>Medium (Balanced)</option>
                    <option value="3">Hard (Extreme X)</option>
                </select>
            </div>
            <div class="action-buttons">
                <button class="btn-action btn-bet" id="bet-btn">START (BET)</button>
                <button class="btn-action btn-next" id="next-btn" disabled style="display:none;">NEXT ➡️</button>
                <button class="btn-action btn-warp" id="warp-btn" style="display:none;">WARP 🚀</button>
                <button class="btn-action btn-cashout" id="cashout-btn" disabled style="display:none;">CASH OUT</button>
            </div>
        </div>
    </div>
</div>

<script>
const casinoMultiplierCurves = {
    1: {
        1: [1.06, 1.15, 1.28, 1.45, 1.68, 1.98, 2.40, 3.00, 3.80, 5.00],
        2: [6.50, 8.50, 11.50, 15.50, 21.00, 29.00, 40.00, 55.00, 75.00, 100.00],
        3: [130.00, 175.00, 240.00, 330.00, 460.00, 650.00, 900.00, 1300.00, 1900.00, 2800.00]
    },
    2: {
        1: [1.18, 1.45, 1.85, 2.45, 3.35, 4.70, 6.80, 10.00, 15.00, 24.00],
        2: [32.00, 45.00, 65.00, 95.00, 140.00, 210.00, 320.00, 480.00, 750.00, 1200.00],
        3: [1600.00, 2300.00, 3400.00, 5000.00, 7500.00, 11500.00, 18000.00, 28000.00, 45000.00, 75000.00]
    },
    3: {
        1: [1.45, 2.20, 3.40, 5.50, 9.00, 15.00, 26.00, 45.00, 80.00, 150.00],
        2: [250.00, 420.00, 750.00, 1350.00, 2500.00, 4800.00, 9200.00, 18000.00, 35000.00, 70000.00],
        3: [110000.00, 180000.00, 300000.00, 500000.00, 850000.00, 1500000.00, 2600000.00, 4500000.00, 7500000.00, 12000000.00]
    }
};

let balance = 1000;
let currentBet = 0;
let isPlaying = false;
let currentStep = 0;
let currentWorld = 1;
const BLOCKS_PER_WORLD = 10;
let accumulatedMult = 1.0;
let baseGuaranteedMult = 0.0;
let isTurbo = false;
let particles = [];
let cameraX = 0;

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const groundY = 270;

const mario = { x: 30, y: groundY - 54, w: 38, h: 54, targetX: 30, vy: 0, gravity: 0.95, state: 'idle' };
let blocks = [];
let flagPole = { x: 0, y: 70, w: 8, h: 200, flagY: 80, isHit: false };

const sprites = { mario: new Image(), marioJump: new Image(), poisonMushroom: new Image(), coin: new Image() };
sprites.mario.src = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 56'><ellipse cx='20' cy='12' rx='14' ry='10' fill='%23ef4444'/><ellipse cx='28' cy='12' rx='6' ry='3' fill='%23ef4444'/><ellipse cx='20' cy='22' rx='11' ry='9' fill='%23fed7aa'/><circle cx='25' cy='19' r='2.5' fill='%23000'/><ellipse cx='26' cy='25' rx='7' ry='4' fill='%23451a03'/><ellipse cx='20' cy='38' rx='12' ry='12' fill='%232563eb'/><rect x='10' y='32' width='20' height='16' fill='%232563eb'/><circle cx='14' cy='34' r='2' fill='%23fbbf24'/><circle cx='26' cy='34' r='2' fill='%23fbbf24'/><rect x='6' y='30' width='6' height='10' fill='%23ef4444'/><rect x='28' y='30' width='6' height='10' fill='%23ef4444'/><circle cx='7' cy='42' r='4' fill='%23fff'/><circle cx='33' cy='42' r='4' fill='%23fff'/><ellipse cx='13' cy='52' rx='7' ry='4' fill='%2378350f'/><ellipse cx='27' cy='52' rx='7' ry='4' fill='%2378350f'/></svg>";
sprites.marioJump.src = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 56'><ellipse cx='20' cy='10' rx='14' ry='10' fill='%23ef4444'/><ellipse cx='28' cy='10' rx='6' ry='3' fill='%23ef4444'/><ellipse cx='20' cy='20' rx='11' ry='9' fill='%23fed7aa'/><circle cx='25' cy='17' r='2.5' fill='%23000'/><ellipse cx='26' cy='23' rx='7' ry='4' fill='%23451a03'/><ellipse cx='20' cy='36' rx='12' ry='11' fill='%232563eb'/><rect x='10' y='30' width='20' height='14' fill='%232563eb'/><circle cx='14' cy='32' r='2' fill='%23fbbf24'/><circle cx='26' cy='32' r='2' fill='%23fbbf24'/><rect x='4' y='20' width='8' height='12' fill='%23ef4444'/><circle cx='6' cy='18' r='4.5' fill='%23fff'/><ellipse cx='10' cy='48' rx='7' ry='5' fill='%2378350f'/><ellipse cx='30' cy='46' rx='7' ry='5' fill='%2378350f'/></svg>";
sprites.poisonMushroom.src = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 50 50'><path d='M5 28 C5 10, 45 10, 45 28 Z' fill='%239333ea'/><circle cx='16' cy='20' r='5' fill='%23e9d5ff'/><circle cx='34' cy='20' r='5' fill='%23e9d5ff'/><circle cx='25' cy='14' r='4' fill='%23e9d5ff'/><rect x='15' y='28' width='20' height='16' rx='4' fill='%23f3e8ff'/><ellipse cx='20' cy='34' rx='2' ry='4' fill='%23000'/><ellipse cx='30' cy='34' rx='2' ry='4' fill='%23000'/></svg>";
sprites.coin.src = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><circle cx='20' cy='20' r='18' fill='%23fbbf24'/><circle cx='20' cy='20' r='14' fill='%23f59e0b'/><rect x='18' y='10' width='4' height='20' rx='2' fill='%23fff'/></svg>";

function formatMultiplierText(val) {
    if (val >= 1000000) return (val / 1000000).toFixed(1) + 'M';
    if (val >= 10000) return (val / 1000).toFixed(1) + 'K';
    if (val >= 100) return Math.round(val) + 'x';
    return val.toFixed(2) + 'x';
}

function initWorld(worldIndex) {
    blocks = [];
    currentWorld = worldIndex;
    const diffKey = parseInt(document.getElementById('mines-select').value || 2);
    const startX = 90;
    const spacing = 65;
    const curve = casinoMultiplierCurves[diffKey][currentWorld];

    for (let i = 0; i < BLOCKS_PER_WORLD; i++) {
        blocks.push({ x: startX + i * spacing, y: 120, w: 46, h: 46, mult: curve[i], hit: false, isPoison: false, bounce: 0 });
    }
    flagPole.x = startX + BLOCKS_PER_WORLD * spacing + 30;
    flagPole.flagY = 80;
    flagPole.isHit = false;
}

function addHistory(mult, isWin) {
    const list = document.getElementById('history-list');
    if (list.children.length === 1 && list.children[0].textContent.includes('No rounds')) list.innerHTML = '';
    const item = document.createElement('div');
    item.className = 'history-item';
    item.innerHTML = `<span>Round</span><span class="${isWin ? 'item-win' : 'item-loss'}">${isWin ? '+' : ''}${formatMultiplierText(mult)}</span>`;
    list.insertBefore(item, list.firstChild);
}

function startGame() {
    const bet = parseFloat(document.getElementById('bet-input').value);
    if (isNaN(bet) || bet <= 0 || bet > balance) return;

    balance -= bet;
    currentBet = bet;
    isPlaying = true;
    currentStep = 0;
    accumulatedMult = 1.0;
    baseGuaranteedMult = 0.0;
    initWorld(1);

    mario.x = 30; mario.y = groundY - mario.h; mario.targetX = 30;
    document.getElementById('balance-display').textContent = `$${balance.toFixed(2)}`;

    document.getElementById('bet-btn').style.display = 'none';
    document.getElementById('next-btn').style.display = 'flex';
    document.getElementById('cashout-btn').style.display = 'flex';

    takeStep();
}

function takeStep() {
    if (!isPlaying) return;
    document.getElementById('next-btn').disabled = true;
    document.getElementById('cashout-btn').disabled = true;

    if (currentStep < BLOCKS_PER_WORLD) {
        mario.targetX = blocks[currentStep].x + (blocks[currentStep].w - mario.w) / 2;
        mario.state = 'moving';
    }
}

function hitBlock() {
    const block = blocks[currentStep];
    block.hit = true;
    block.bounce = 14;

    const diffKey = parseInt(document.getElementById('mines-select').value || 2);
    const curve = casinoMultiplierCurves[diffKey][currentWorld];
    const curM = curve[currentStep];
    const prevM = (currentStep === 0) ? 1.0 : curve[currentStep - 1];

    const survivalProb = Math.min(0.98, Math.max(0.01, (prevM / curM) * 0.97));
    const isPoison = (Math.random() > survivalProb);
    block.isPoison = isPoison;

    if (isPoison) {
        isPlaying = false;
        addHistory(0, false);
        document.getElementById('status-msg').innerHTML = `<span style="color:#ef4444;">Poison Mushroom! Lost $${currentBet.toFixed(2)}</span>`;
        endRound();
    } else {
        const currentWin = currentBet * block.mult;
        currentStep++;

        if (currentStep >= BLOCKS_PER_WORLD) {
            cashOut();
        } else {
            const nextMult = blocks[currentStep].mult;
            document.getElementById('cashout-btn').textContent = `CASH OUT ($${currentWin.toFixed(2)})`;
            document.getElementById('next-btn').textContent = `NEXT (${formatMultiplierText(nextMult)})`;
            document.getElementById('status-msg').innerHTML = `Current: <strong style="color:#fbbf24;">$${currentWin.toFixed(2)}</strong> | Next: <strong style="color:#38bdf8;">$${(currentBet * nextMult).toFixed(2)}</strong>`;
            document.getElementById('next-btn').disabled = false;
            document.getElementById('cashout-btn').disabled = false;
        }
    }
}

function cashOut() {
    if (!isPlaying) return;
    const finalMult = blocks[currentStep - 1].mult;
    const win = currentBet * finalMult;
    balance += win;
    addHistory(finalMult, true);
    document.getElementById('status-msg').innerHTML = `<span style="color:#4ade80;">Cashed Out: +$${win.toFixed(2)} (${formatMultiplierText(finalMult)})</span>`;
    endRound();
}

function endRound() {
    isPlaying = false;
    document.getElementById('balance-display').textContent = `$${balance.toFixed(2)}`;
    document.getElementById('bet-btn').style.display = 'flex';
    document.getElementById('next-btn').style.display = 'none';
    document.getElementById('cashout-btn').style.display = 'none';
}

function update() {
    if (mario.state === 'moving') {
        const dx = mario.targetX - mario.x;
        if (Math.abs(dx) > 8) { mario.x += Math.sign(dx) * 8; }
        else { mario.x = mario.targetX; mario.state = 'jumping'; mario.vy = -12; }
    }
    if (mario.state === 'jumping') {
        mario.y += mario.vy;
        mario.vy += mario.gravity;
        const currentBlock = blocks[currentStep];
        if (mario.vy < 0 && mario.y <= currentBlock.y + currentBlock.h) {
            mario.y = currentBlock.y + currentBlock.h;
            mario.vy = 3;
            hitBlock();
        }
        if (mario.y >= groundY - mario.h) { mario.y = groundY - mario.h; mario.vy = 0; mario.state = 'idle'; }
    }
    blocks.forEach(b => { if (b.bounce > 0) b.bounce -= 1.5; });
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#0284c7'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#15803d'; ctx.fillRect(0, groundY, canvas.width, 8);
    ctx.fillStyle = '#78350f'; ctx.fillRect(0, groundY + 8, canvas.width, canvas.height - groundY - 8);

    blocks.forEach(b => {
        const renderY = b.y - b.bounce;
        if (!b.hit) {
            ctx.fillStyle = '#f59e0b'; ctx.beginPath(); ctx.roundRect(b.x, renderY, b.w, b.h, 8); ctx.fill();
            ctx.fillStyle = '#fff'; ctx.font = '900 18px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('?', b.x + b.w / 2, renderY + 30);
            ctx.fillStyle = '#38bdf8'; ctx.font = '800 11px sans-serif'; ctx.fillText(formatMultiplierText(b.mult), b.x + b.w / 2, renderY - 8);
        } else {
            ctx.fillStyle = '#334155'; ctx.beginPath(); ctx.roundRect(b.x, renderY, b.w, b.h, 8); ctx.fill();
            if (b.isPoison) {
                ctx.drawImage(sprites.poisonMushroom, b.x + (b.w - 36) / 2, renderY - 38, 36, 36);
            } else {
                ctx.drawImage(sprites.coin, b.x + (b.w - 28) / 2, renderY - 34, 28, 28);
            }
        }
    });

    ctx.fillStyle = '#cbd5e1'; ctx.fillRect(flagPole.x, flagPole.y, flagPole.w, flagPole.h);
    ctx.drawImage((mario.state === 'jumping') ? sprites.marioJump : sprites.mario, mario.x, mario.y, mario.w, mario.h);
}

function loop() { update(); draw(); requestAnimationFrame(loop); }

document.getElementById('btn-half').addEventListener('click', () => document.getElementById('bet-input').value = Math.max(1, Math.floor(parseFloat(document.getElementById('bet-input').value || 10) / 2)));
document.getElementById('btn-double').addEventListener('click', () => document.getElementById('bet-input').value = Math.min(balance, Math.floor(parseFloat(document.getElementById('bet-input').value || 10) * 2)));
document.getElementById('btn-max').addEventListener('click', () => document.getElementById('bet-input').value = Math.floor(balance));
document.getElementById('bet-btn').addEventListener('click', startGame);
document.getElementById('next-btn').addEventListener('click', takeStep);
document.getElementById('cashout-btn').addEventListener('click', cashOut);

initWorld(1);
loop();
</script>
</body>
</html>
